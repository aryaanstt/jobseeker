<title>Jobseeker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Libre+Franklin:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Papan loker cetak: kertas, tinta, satu warna sinyal oranye. Garis tipis, sudut tajam,
   tanpa kartu, tanpa bayangan. Kolom kiri = tanggal tutup, kanan = meter nilai. */
:root{
  --paper:#f1ede3; --paper2:#e8e3d6; --ink:#1c1b18; --ink2:#4a4740; --ink3:#837e72;
  --rule:#cbc4b3; --sig:#c4410f; --ok:#2f6b3f; --bad:#a3271b;
  --head:"Big Shoulders Display",Impact,"Arial Narrow",sans-serif;
  --text:"Libre Franklin",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --col:58px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#161512; --paper2:#1f1d19; --ink:#ebe5d6; --ink2:#bdb6a5; --ink3:#857f72;
  --rule:#36332c; --sig:#f0874f; --ok:#8cc49a; --bad:#ef8a7c; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#161512; --paper2:#1f1d19; --ink:#ebe5d6; --ink2:#bdb6a5; --ink3:#857f72;
  --rule:#36332c; --sig:#f0874f; --ok:#8cc49a; --bad:#ef8a7c; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Kepala koran */
header{border-bottom:3px solid var(--ink);padding-bottom:6px}
.mast{font-family:var(--head);font-weight:800;font-size:clamp(44px,13vw,76px);line-height:.86;letter-spacing:.005em;text-transform:uppercase;margin:0}
.mast span{color:var(--sig)}
.dateline{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--ink);margin-top:10px;padding-top:5px;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.dateline #sync{font-family:var(--mono);font-weight:400;letter-spacing:0;text-transform:none;color:var(--ink3)}

/* Angka ringkasan */
.counts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--ink)}
.count{padding:12px 12px 10px;border-left:1px solid var(--rule);min-width:0}
.count:first-child{border-left:0;padding-left:0}
.count b{display:block;font-family:var(--head);font-weight:700;font-size:44px;line-height:.95;font-variant-numeric:tabular-nums}
.count small{display:block;margin-top:4px;font-size:11.5px;line-height:1.3;color:var(--ink2)}
.count.hot b{color:var(--sig)}
@media (max-width:440px){.counts{grid-template-columns:repeat(2,minmax(0,1fr))}.count:nth-child(3){border-left:0;padding-left:0}.count:nth-child(n+3){border-top:1px solid var(--rule)}}

.next{display:flex;flex-wrap:wrap;gap:2px 12px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--rule);font-size:13.5px}
.next .k{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--sig)}
.next .d{font-family:var(--mono);font-size:12.5px;color:var(--sig);margin-right:6px}

/* Tab dan saringan */
.tabs{display:flex;gap:22px;margin-top:22px;border-bottom:1px solid var(--ink)}
.tab{background:none;border:0;padding:0 0 6px;font-weight:700;font-size:19px;letter-spacing:-.01em;color:var(--ink3);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tab .n{font-family:var(--mono);font-weight:400;font-size:12px;margin-left:5px;vertical-align:2px}
.filters{display:flex;gap:4px 16px;flex-wrap:wrap;padding:10px 0 8px}
.chip{background:none;border:0;padding:2px 0;font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);cursor:pointer;border-bottom:2px solid transparent}
.chip[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--sig)}
.chip .n{font-family:var(--mono);font-weight:400;letter-spacing:0;margin-left:4px}

/* Baris loker */
.list{border-top:1px solid var(--ink)}
.item{border-bottom:1px solid var(--rule)}
.row{all:unset;box-sizing:border-box;display:grid;grid-template-columns:var(--col) minmax(0,1fr) auto;gap:0 12px;width:100%;padding:13px 0 12px;cursor:pointer;align-items:start}
.row:focus-visible{outline:2px solid var(--sig);outline-offset:2px}
@media (hover:hover){.row:hover .co{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}}
.when{text-align:left;line-height:1}
.when b{display:block;font-family:var(--head);font-weight:700;font-size:30px;line-height:.9}
.when span{display:block;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-top:3px}
.when em{display:block;font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--ink3);margin-top:4px}
.when.none b{color:var(--ink3);font-size:22px}
.when.soon b,.when.soon span,.when.soon em{color:var(--sig)}
.main{min-width:0}
.co{font-weight:700;font-size:15.5px;line-height:1.25;overflow-wrap:anywhere}
.prog{color:var(--ink2);font-size:13.5px;line-height:1.35;margin-top:2px;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:3px 12px;margin-top:6px;font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.meta .sig{color:var(--sig)} .meta .ok{color:var(--ok)} .meta .bad{color:var(--bad)}
.meter{display:flex;flex-direction:column;align-items:flex-end;gap:5px;padding-top:3px}
.bars{display:flex;gap:2px}
.bars i{width:6px;height:14px;background:var(--rule)}
.bars i.on{background:var(--ink)}
.meter.s5 .bars i.on{background:var(--sig)}
.meter small{font-family:var(--mono);font-size:10.5px;color:var(--ink3)}

/* Detail */
.detail{padding:4px 0 18px var(--col);margin-left:12px;display:flex;flex-direction:column;gap:14px;font-size:14px}
@media (max-width:440px){.detail{padding-left:0;margin-left:0}}
.sec h3{display:flex;align-items:center;gap:8px;margin:0 0 5px;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.sec h3::after{content:"";flex:1;height:1px;background:var(--rule)}
.sec p{margin:0;color:var(--ink2)}
.sec .why{color:var(--ink);font-size:14.5px}
.sec.out .why{color:var(--bad)}
.sec ul{margin:0;padding-left:0;list-style:none;color:var(--ink2)}
.sec li{padding-left:16px;position:relative}
.sec li::before{content:"–";position:absolute;left:0;color:var(--ink3)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 14px;margin:0;font-size:13px}
.kv dt{color:var(--ink3);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding-top:2px}
.kv dd{margin:0;color:var(--ink2);min-width:0;overflow-wrap:anywhere}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font-size:13px;font-weight:700;letter-spacing:.02em;padding:9px 14px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;border-radius:0}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,select:focus-visible,.copy:focus-visible{outline:2px solid var(--sig);outline-offset:2px}
.state{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ok)}

/* Paket lamaran */
.pack{border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);background:var(--paper2)}
.field{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 12px;padding:9px 10px;border-top:1px dashed var(--rule)}
.field:first-child{border-top:0}
.field .lbl{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.field .val{grid-column:1;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere;user-select:text}
.field .val.empty{color:var(--sig);font-style:italic}
.field .note{grid-column:1;font-size:12px;color:var(--ink2);margin-top:2px}
.copy{grid-row:1/4;grid-column:2;align-self:center;background:none;border:0;padding:6px 0 6px 6px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--sig);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.nopack{color:var(--ink2);font-size:13px;border-left:3px solid var(--rule);padding:2px 0 2px 10px}

/* Lamaran */
.stage{display:flex;align-items:baseline;gap:10px;padding:18px 0 6px;border-bottom:1px solid var(--ink);font-family:var(--head);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.01em}
.stage:first-child{padding-top:10px}
.stage .n{font-family:var(--mono);font-size:12px;font-weight:400;color:var(--ink3)}
.lrow{display:grid;grid-template-columns:var(--col) minmax(0,1fr);gap:0 12px;padding:12px 0}
.lrow .detail{grid-column:2;padding:8px 0 0;margin:0;gap:10px}
@media (max-width:440px){.lrow .detail{grid-column:1/3}}
select{font:inherit;font-size:13px;font-weight:600;background:var(--paper);color:var(--ink);border:1.5px solid var(--ink);border-radius:0;padding:7px 8px}

.empty{color:var(--ink2);padding:28px 0;font-size:14px;border-bottom:1px solid var(--rule)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);font-size:13px;font-weight:600;padding:9px 14px;max-width:calc(100% - 32px)}
</style>

<div class="wrap">
  <header>
    <h1 class="mast">Job<span>/</span>seeker</h1>
    <div class="dateline"><span id="today"></span><span id="sync">memuat…</span></div>
  </header>

  <section class="counts" aria-label="Ringkasan">
    <div class="count"><b id="c-dilamar">–</b><small>sudah dilamar</small></div>
    <div class="count"><b id="c-jalan">–</b><small>lagi diproses</small></div>
    <div class="count"><b id="c-lolos">–</b><small>lolos tahap lanjut</small></div>
    <div class="count hot"><b id="c-cocok">–</b><small>cocok, belum dilamar</small></div>
  </section>

  <div class="next" id="next" hidden></div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-loker" aria-selected="true">Loker<span class="n" id="n-loker"></span></button>
    <button class="tab" role="tab" id="tab-lamaran" aria-selected="false">Lamaran<span class="n" id="n-lamaran"></span></button>
  </div>

  <div class="filters" id="filters" role="group" aria-label="Saring loker">
    <button class="chip" data-f="cocok" aria-pressed="true">Cocok<span class="n" id="f-cocok"></span></button>
    <button class="chip" data-f="dekat" aria-pressed="false">Tutup ≤14 hari<span class="n" id="f-dekat"></span></button>
    <button class="chip" data-f="semua" aria-pressed="false">Semua<span class="n" id="f-semua"></span></button>
    <button class="chip" data-f="gugur" aria-pressed="false">Gugur<span class="n" id="f-gugur"></span></button>
  </div>

  <main class="list" id="list"><div class="empty">Memuat loker dan lamaran…</div></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const STAGES=["Mau daftar","Interview","Tes","Lolos berkas","Menunggu hasil","Udah daftar","Diterima","Ditolak","Batal"];
const ACTIVE=["Udah daftar","Lolos berkas","Tes","Interview","Menunggu hasil"];
const LANJUT=["Lolos berkas","Tes","Interview","Diterima"];
const $=id=>document.getElementById(id);
let db=null, canWrite=false, loker=[], lamaran=[], tab="loker", filter="cocok", open=new Set();
try{const s=localStorage.getItem("js-tab");if(s==="lamaran"||s==="loker")tab=s;const f=localStorage.getItem("js-filter");if(["cocok","dekat","semua","gugur"].includes(f))filter=f}catch(e){}
if(location.hash==="#lamaran")tab="lamaran";
$("today").textContent=new Date().toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"});

const arr=x=>Array.isArray(x)?x:(x?[x]:[]);
function today(){const d=new Date();d.setHours(0,0,0,0);return d}
function parse(s){if(!s)return null;const d=new Date(s+"T00:00:00");return isNaN(d)?null:d}
function days(s){const d=parse(s);return d?Math.round((d-today())/864e5):null}
function fmt(s){const d=parse(s);return d?d.toLocaleDateString("id-ID",{day:"numeric",month:"short"}):""}
function rel(n){if(n===null)return"";if(n<0)return"lewat";if(n===0)return"hari ini";if(n===1)return"besok";return n+" hari"}
function h(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function toast(msg){const t=$("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2200)}
const lamaranFor=id=>lamaran.find(l=>(l.loker_id||l._id)===id);
const isGugur=l=>!!l.gugur||(days(l.deadline)!==null&&days(l.deadline)<0);
const FILTERS={
  cocok:l=>(l.nilai||0)>=4&&!isGugur(l),
  dekat:l=>{const n=days(l.deadline);return n!==null&&n>=0&&n<=14&&!l.gugur},
  semua:l=>!isGugur(l),
  gugur:isGugur
};

function whenCol(dateStr,label){
  const w=h("div","when");const d=parse(dateStr);
  if(!d){w.classList.add("none");w.append(h("b",null,"—"));w.append(h("span",null,label||"tanpa tgl"));return w}
  const n=days(dateStr);if(n!==null&&n>=0&&n<=3)w.classList.add("soon");
  w.append(h("b",null,String(d.getDate())));
  w.append(h("span",null,d.toLocaleDateString("id-ID",{month:"short"}).replace(".","")));
  w.append(h("em",null,rel(n)));
  return w;
}
function meter(n){
  const m=h("div","meter s"+(n||0));if(!n)return m;
  const b=h("div","bars");for(let i=1;i<=5;i++)b.append(h("i",i<=n?"on":null));
  m.setAttribute("aria-label","Nilai "+n+" dari 5");m.append(b);m.append(h("small",null,n+"/5"));return m;
}

function counts(){
  $("c-dilamar").textContent=lamaran.filter(l=>!["Mau daftar","Batal"].includes(l.status)).length;
  $("c-jalan").textContent=lamaran.filter(l=>ACTIVE.includes(l.status)).length;
  $("c-lolos").textContent=lamaran.filter(l=>LANJUT.includes(l.status)).length;
  $("c-cocok").textContent=loker.filter(l=>FILTERS.cocok(l)&&!lamaranFor(l._id)).length;
  $("n-loker").textContent=loker.length||"";$("n-lamaran").textContent=lamaran.length||"";
  for(const k in FILTERS)$("f-"+k).textContent=loker.length?loker.filter(FILTERS[k]).length:"";
  const ev=[];
  for(const l of lamaran){if(["Ditolak","Batal","Diterima"].includes(l.status))continue;
    if(l.agenda_tanggal)ev.push({d:l.agenda_tanggal,t:(l.agenda||"Agenda")+", "+l.perusahaan});
    if(l.status==="Mau daftar"&&l.deadline)ev.push({d:l.deadline,t:"Tutup: "+l.perusahaan});}
  for(const l of loker){if(l.deadline&&!lamaranFor(l._id)&&(l.nilai||0)>=4&&!l.gugur)ev.push({d:l.deadline,t:"Tutup: "+l.perusahaan})}
  const up=ev.filter(e=>days(e.d)!==null&&days(e.d)>=0).sort((a,b)=>a.d.localeCompare(b.d))[0];
  const nx=$("next");nx.textContent="";
  if(up){nx.append(h("span","k","Berikutnya"));const s=h("span");s.append(h("span","d",fmt(up.d)+", "+rel(days(up.d))));s.append(up.t);nx.append(s);nx.hidden=false}else nx.hidden=true;
}

function lokerRow(l){
  const it=h("article","item");
  const row=h("button","row");row.setAttribute("aria-expanded",open.has(l._id)?"true":"false");
  row.append(whenCol(l.deadline));
  const main=h("div","main");
  main.append(h("div","co",l.perusahaan||""));
  main.append(h("div","prog",l.program||""));
  const meta=h("div","meta");
  const lm=lamaranFor(l._id);
  if(lm)meta.append(h("span","ok",lm.status));
  if(l.gugur)meta.append(h("span","bad","Gugur"));
  if(arr(l.paket).length)meta.append(h("span","ok","Paket siap"));
  if(l.status==="perlu dicek")meta.append(h("span","sig","Perlu dicek"));
  if(l.risiko_jurusan)meta.append(h("span","sig","Risiko jurusan"));
  if(l.kategori)meta.append(h("span",null,l.kategori));
  if(l.lokasi&&l.lokasi.length<=22)meta.append(h("span",null,l.lokasi));
  main.append(meta);row.append(main);
  row.append(meter(l.nilai));
  row.addEventListener("click",()=>{open.has(l._id)?open.delete(l._id):open.add(l._id);render()});
  it.append(row);
  if(open.has(l._id))it.append(lokerDetail(l,lm));
  return it;
}
function sec(title,cls){const s=h("div","sec"+(cls?" "+cls:""));s.append(h("h3",null,title));return s}

function lokerDetail(l,lm){
  const d=h("div","detail");
  if(l.gugur){const s=sec("Kenapa gugur","out");s.append(h("p","why",l.gugur));d.append(s)}
  if(l.alasan){const s=sec("Penilaian");s.append(h("p","why",l.alasan));d.append(s)}
  const sy=arr(l.syarat);if(sy.length){const s=sec("Syarat");const ul=h("ul");sy.forEach(x=>ul.append(h("li",null,x)));s.append(ul);d.append(s)}
  const kv=h("dl","kv");
  const add=(k,v)=>{if(!v)return;kv.append(h("dt",null,k));kv.append(h("dd",null,v))};
  add("Lokasi",l.lokasi);add("Jalur",arr(l.jalur).join(", "));add("Untuk",l.untuk);add("Dibuka",l.dibuka?fmt(l.dibuka):"");add("Dicek",l.dicek);add("Sumber",l.sumber);
  if(kv.childNodes.length){const s=sec("Info");s.append(kv);d.append(s)}
  if(l.catatan){const s=sec("Catatan");s.append(h("p",null,l.catatan));d.append(s)}
  const pk=arr(l.paket);const ps=sec("Paket lamaran");
  if(pk.length){const box=h("div","pack");pk.forEach(f=>box.append(field(f)));ps.append(box)}
  else ps.append(h("div","nopack","Belum ada. Chat Claude \"siapin paket "+(l.perusahaan||"").split(" (")[0]+"\" kalau mau daftar."));
  d.append(ps);
  const act=h("div","actions");
  if(l.link){const a=h("a","btn","Buka link resmi ↗");a.href=l.link;a.target="_blank";a.rel="noopener";act.append(a)}
  if(canWrite){
    if(!lm){const b=h("button","btn primary","Mau daftar");b.addEventListener("click",()=>setLamaran(l,"Mau daftar",b));act.append(b)}
    else if(lm.status==="Mau daftar"){const b=h("button","btn primary","Udah gua submit");b.addEventListener("click",()=>updateStatus(lm,"Udah daftar",b,true));act.append(b)}
    else act.append(h("span","state","Di tracker: "+lm.status));
  }
  d.append(act);
  return d;
}

function field(f){
  const r=h("div","field");r.append(h("div","lbl",f.label||""));
  const v=h("div","val"+(f.isi?"":" empty"),f.isi||"isi sendiri");r.append(v);
  if(f.catatan)r.append(h("div","note",f.catatan));
  if(f.isi){const c=h("button","copy","Salin");c.setAttribute("aria-label","Salin "+(f.label||""));
    c.addEventListener("click",ev=>{ev.stopPropagation();const p=navigator.clipboard&&navigator.clipboard.writeText(f.isi);
      if(p)p.then(()=>toast("Disalin: "+(f.label||""))).catch(()=>selectText(v));else selectText(v)});r.append(c)}
  return r;
}
function selectText(el){const s=getSelection(),rg=document.createRange();rg.selectNodeContents(el);s.removeAllRanges();s.addRange(rg);toast("Teks dipilih, tinggal salin")}

async function setLamaran(l,status,btn){
  btn.disabled=true;
  try{await db.doc("lamaran/"+l._id).set({loker_id:l._id,perusahaan:l.perusahaan,posisi:l.program,status,nilai:l.nilai||null,deadline:l.deadline||null,link:l.link||null,diperbarui:new Date().toISOString().slice(0,10)});toast("Masuk tracker: "+status)}
  catch(e){toast("Gagal menyimpan. Coba lagi.");btn.disabled=false}
}
async function updateStatus(lm,status,btn,stampDate){
  if(btn)btn.disabled=true;
  const body={status,diperbarui:new Date().toISOString().slice(0,10)};
  if(stampDate&&!lm.tanggal_daftar)body.tanggal_daftar=body.diperbarui;
  try{await db.doc("lamaran/"+lm._id).update(body);toast(lm.perusahaan+" → "+status)}
  catch(e){toast("Gagal menyimpan. Coba lagi.");if(btn)btn.disabled=false}
}

function lamaranRow(l){
  const it=h("article","item lrow");
  const key=l.agenda_tanggal||(l.status==="Mau daftar"?l.deadline:null)||l.tanggal_daftar;
  it.append(whenCol(key,""));
  const main=h("div","main");
  main.append(h("div","co",l.perusahaan||""));
  main.append(h("div","prog",[l.posisi,l.jalur].filter(Boolean).join(" · ")));
  const meta=h("div","meta");
  if(l.agenda)meta.append(h("span","sig",l.agenda+(l.agenda_tanggal?" "+fmt(l.agenda_tanggal):"")));
  if(l.status==="Mau daftar"&&l.deadline)meta.append(h("span",null,"Tutup "+fmt(l.deadline)));
  if(l.tanggal_daftar)meta.append(h("span",null,"Daftar "+fmt(l.tanggal_daftar)));
  if(l.nilai)meta.append(h("span",null,"Nilai "+l.nilai+"/5"));
  if(meta.childNodes.length)main.append(meta);
  it.append(main);
  const d=h("div","detail");
  if(l.catatan)d.append(h("p",null,l.catatan));
  const act=h("div","actions");
  if(canWrite){const sel=document.createElement("select");sel.id="st-"+l._id;sel.setAttribute("aria-label","Status "+(l.perusahaan||""));
    STAGES.forEach(s=>{const o=h("option",null,s);o.value=s;if(s===l.status)o.selected=true;sel.append(o)});
    sel.addEventListener("change",()=>updateStatus(l,sel.value,null,sel.value==="Udah daftar"));act.append(sel)}
  const lk=l.link||(loker.find(x=>x._id===l.loker_id)||{}).link;
  if(lk){const a=h("a","btn","Link ↗");a.href=lk;a.target="_blank";a.rel="noopener";act.append(a)}
  if(l.loker_id&&loker.find(x=>x._id===l.loker_id)){const b=h("button","btn","Lihat paket");b.addEventListener("click",()=>{tab="loker";filter="semua";open.add(l.loker_id);save();render();scrollTo(0,0)});act.append(b)}
  if(act.childNodes.length)d.append(act);
  if(d.childNodes.length)it.append(d);
  return it;
}

function render(){
  counts();
  $("tab-loker").setAttribute("aria-selected",tab==="loker");$("tab-lamaran").setAttribute("aria-selected",tab==="lamaran");
  $("filters").hidden=tab!=="loker";
  document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c.dataset.f===filter));
  const list=$("list");list.textContent="";
  if(tab==="loker"){
    const xs=loker.filter(FILTERS[filter]);
    xs.sort((a,b)=>(b.nilai||0)-(a.nilai||0)||(a.deadline||"9999").localeCompare(b.deadline||"9999"));
    if(!xs.length){list.append(h("div","empty",filter==="cocok"?"Belum ada loker bernilai 4 ke atas. Chat Claude \"cari loker\" buat nambah.":"Ga ada loker di saringan ini."));return}
    xs.forEach(l=>list.append(lokerRow(l)));
  }else{
    if(!lamaran.length){list.append(h("div","empty","Belum ada lamaran. Buka tab Loker, pilih satu, pencet \"Mau daftar\"."));return}
    for(const st of STAGES){const g=lamaran.filter(l=>l.status===st);if(!g.length)continue;
      const head=h("div","stage",st);head.append(h("span","n",String(g.length)));list.append(head);
      g.sort((a,b)=>(a.agenda_tanggal||a.deadline||"9999").localeCompare(b.agenda_tanggal||b.deadline||"9999")).forEach(l=>list.append(lamaranRow(l)))}
  }
}
function save(){try{localStorage.setItem("js-tab",tab);localStorage.setItem("js-filter",filter)}catch(e){}}

$("tab-loker").onclick=()=>{tab="loker";save();render()};
$("tab-lamaran").onclick=()=>{tab="lamaran";save();render()};
document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{filter=c.dataset.f;save();render()});

(async()=>{
  const timer=setTimeout(()=>{$("sync").textContent="belum tersambung"},10000);
  db=await claude.use("db");
  if(!db){clearTimeout(timer);$("sync").textContent="";$("list").textContent="";$("list").append(h("div","empty","Masuk ke akun Claude dulu buat buka Jobseeker."));return}
  const user=await claude.use("user");
  try{canWrite=user?await user.isOwner():false}catch(e){canWrite=false}
  let got=0;const done=snap=>{if(!snap.metadata.fromCache&&++got>=2)clearTimeout(timer)};
  const stamp=()=>{const all=[...loker,...lamaran].map(x=>x.diperbarui||"").sort();const u=all.pop();$("sync").textContent=u?"update "+fmt(u):""};
  db.collection("loker").onSnapshot(s=>{loker=s.docs.map(d=>({...d.data(),_id:d.id}));done(s);stamp();render()},()=>{$("sync").textContent="loker gagal dimuat"});
  db.collection("lamaran").onSnapshot(s=>{lamaran=s.docs.map(d=>({...d.data(),_id:d.id}));done(s);stamp();render()},()=>{$("sync").textContent="lamaran gagal dimuat"});
})();
render();
</script>
