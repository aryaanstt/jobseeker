<title>Jobseeker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Konsep: jalur lamaran. Tiap lamaran jalan di satu rel dengan stasiun
   Mau daftar → Daftar → Berkas → Tes → Interview → Diterima. Loker = kartu
   dengan titik nilai (titik khas get it) dan sobekan tenggat. Header atas di
   laptop, tab bawah di HP. Satu aksen: biru get a job. */
:root{
  --bg:#F2F4F7; --panel:#FFFFFF; --panel-2:#EEF1F5; --garis:#DCE1E8; --garis-kuat:#C3CAD5;
  --ink:#0E1525; --ink-2:#3A4254; --redup:#687084; --titik:rgba(14,21,37,.07);
  --biru:#378ADD; --biru-teks:#2F7BCF; --biru-lembut:#E4EFFB; --biru-tekan:#1F5FA3;
  --ok:#1E8A57; --ok-lembut:#E2F3EA; --awas:#B4530C; --awas-lembut:#FCEEDF; --bad:#BE3A2E; --bad-lembut:#FBE6E3;
  --f-judul:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --f-teks:"Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif;
  --f-kode:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px; --tab-h:64px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111110; --panel:#1A1A19; --panel-2:#21211F; --garis:#2B2B29; --garis-kuat:#3C3C39;
  --ink:#EDEDEA; --ink-2:#CFCFCA; --redup:#9A9A94; --titik:transparent;
  --biru:#4A97E6; --biru-teks:#7DB6F0; --biru-lembut:#1A2532; --biru-tekan:#2E6FB3;
  --ok:#5ED69A; --ok-lembut:#16251D; --awas:#F0A35E; --awas-lembut:#2A1F14; --bad:#F08A80; --bad-lembut:#2C1816; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111110; --panel:#1A1A19; --panel-2:#21211F; --garis:#2B2B29; --garis-kuat:#3C3C39;
  --ink:#EDEDEA; --ink-2:#CFCFCA; --redup:#9A9A94; --titik:transparent;
  --biru:#4A97E6; --biru-teks:#7DB6F0; --biru-lembut:#1A2532; --biru-tekan:#2E6FB3;
  --ok:#5ED69A; --ok-lembut:#16251D; --awas:#F0A35E; --awas-lembut:#2A1F14; --bad:#F08A80; --bad-lembut:#2C1816; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);background-image:radial-gradient(var(--titik) 1px,transparent 1.2px);background-size:18px 18px;color:var(--ink);font-family:var(--f-teks);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;touch-action:manipulation}
button,input,select{font:inherit;color:inherit}
a{color:var(--biru-teks)}
h1,h2,h3{font-family:var(--f-judul);letter-spacing:-.02em;text-wrap:balance;margin:0}
.mono{font-family:var(--f-kode)}
:focus-visible{outline:2px solid var(--biru);outline-offset:2px;border-radius:6px}

/* Header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--garis)}
.top-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:20px;height:60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wm{display:flex;align-items:center;gap:6px;font-family:var(--f-judul);font-weight:800;font-size:22px;letter-spacing:-.03em;text-decoration:none;color:var(--ink);white-space:nowrap}
.wm .get{border:1.5px solid var(--ink);border-radius:99px;padding:0 8px 1px;line-height:1.15}
.wm .dot,.wm .a{color:var(--biru)}
.wm small{font-family:var(--f-kode);font-weight:500;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--redup);margin-left:6px;align-self:flex-end;padding-bottom:4px}
.nav{display:flex;gap:4px;margin-left:auto}
.nav a{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:10px;text-decoration:none;color:var(--ink-2);font-weight:600;font-size:14.5px}
.nav a:hover{background:var(--panel-2)}
.nav a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.nav a .n{font-family:var(--f-kode);font-size:11.5px;opacity:.7}
.ikon{width:40px;height:40px;border-radius:10px;border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.ikon:hover{background:var(--panel-2)}
.ikon svg{width:20px;height:20px}

/* Tab bawah di HP */
.tabbar{display:none}
@media (max-width:760px){
  .nav{display:none}
  .top-in{height:56px}
  .tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--garis);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:var(--tab-h);text-decoration:none;color:var(--redup);font-size:11.5px;font-weight:700}
  .tabbar a svg{width:22px;height:22px}
  .tabbar a[aria-current="page"]{color:var(--biru-teks)}
  .wrap{padding-bottom:calc(var(--tab-h) + 32px)!important}
  .wm small{display:none}
}

.wrap{max-width:1120px;margin:0 auto;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--biru-lembut);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:13.5px;margin-bottom:18px}
.banner b{font-family:var(--f-kode);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--biru-teks);padding-top:2px;white-space:nowrap}

/* Judul halaman */
.eyebrow{font-family:var(--f-kode);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--redup);font-weight:500}
.hero{display:flex;flex-direction:column;gap:6px;margin-bottom:20px}
.hero h1{font-size:clamp(28px,5.4vw,44px);font-weight:800;line-height:1.02;max-width:20ch}
.hero h1 em{font-style:normal;color:var(--biru-teks)}
.hero p{margin:0;color:var(--ink-2);max-width:60ch}
.sec-h{display:flex;align-items:baseline;gap:10px;margin:30px 0 12px}
.sec-h h2{font-size:21px;font-weight:700}
.sec-h .n{font-family:var(--f-kode);font-size:12px;color:var(--redup)}
.sec-h a{margin-left:auto;font-size:13.5px;font-weight:600;text-decoration:none}

/* Rel lamaran (beranda) */
.rel{background:var(--panel);border:1px solid var(--garis);border-radius:var(--r);padding:20px 18px 16px;overflow-x:auto}
.rel-in{display:grid;grid-template-columns:repeat(6,minmax(84px,1fr));position:relative;min-width:520px}
.rel-in::before{content:"";position:absolute;left:calc(100%/12);right:calc(100%/12);top:13px;height:4px;border-radius:4px;background:var(--garis)}
.rel-in .isi{position:absolute;left:calc(100%/12);top:13px;height:4px;border-radius:4px;background:var(--biru);transition:width .8s cubic-bezier(.2,.7,.2,1)}
.st{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;position:relative;background:none;border:0;padding:0;cursor:pointer}
.st i{width:30px;height:30px;border-radius:50%;background:var(--panel);border:4px solid var(--garis-kuat);display:grid;place-items:center;font-style:normal;font-family:var(--f-kode);font-size:12px;font-weight:600;color:var(--redup)}
.st.ada i{border-color:var(--biru);color:var(--biru-teks)}
.st b{font-family:var(--f-judul);font-size:28px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.st span{font-size:12px;font-weight:600;color:var(--ink-2);line-height:1.2}
.st:not(.ada) b{color:var(--garis-kuat)}
.rel-ket{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--garis);font-size:13px;color:var(--ink-2)}
.rel-ket b{font-family:var(--f-kode);font-weight:600}

/* Angka */
.angka{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.angka{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ang{background:var(--panel);border:1px solid var(--garis);border-radius:var(--r);padding:14px 14px 12px;min-width:0}
.ang b{display:block;font-family:var(--f-judul);font-weight:800;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.ang span{display:block;margin-top:6px;font-size:12.5px;color:var(--ink-2);line-height:1.3}
.ang.biru{background:var(--biru);border-color:var(--biru);color:#fff}
.ang.biru span{color:rgba(255,255,255,.85)}

/* Kartu loker */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:12px}
.kartu{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--panel);border:1px solid var(--garis);border-radius:var(--r);padding:14px 16px 0;cursor:pointer;position:relative;overflow:hidden;min-width:0;transition:border-color .15s,transform .15s}
.kartu:hover{border-color:var(--garis-kuat)}
.kartu:active{transform:translateY(1px)}
.k-atas{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.k-co{font-size:13px;font-weight:600;color:var(--ink-2);line-height:1.3;overflow-wrap:anywhere;min-width:0}
.k-judul{font-family:var(--f-judul);font-weight:700;font-size:18.5px;line-height:1.15;letter-spacing:-.015em;overflow-wrap:anywhere}
.nilai{display:flex;gap:3px;flex:none;padding-top:3px}
.nilai i{width:8px;height:8px;border-radius:50%;background:var(--garis)}
.nilai i.on{background:var(--biru)}
.nilai.lima i.on{background:var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--panel-2);color:var(--ink-2);line-height:1.3}
.tag.ok{background:var(--ok-lembut);color:var(--ok)}
.tag.awas{background:var(--awas-lembut);color:var(--awas)}
.tag.bad{background:var(--bad-lembut);color:var(--bad)}
.tag.biru{background:var(--biru-lembut);color:var(--biru-teks)}
/* sobekan tenggat di kaki kartu */
.sobek{margin:4px -16px 0;padding:10px 16px 12px;border-top:2px dashed var(--garis);display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2);position:relative}
.sobek::before,.sobek::after{content:"";position:absolute;top:-9px;width:16px;height:16px;border-radius:50%;background:var(--bg)}
.sobek::before{left:-9px}.sobek::after{right:-9px}
.sobek .tgl{font-family:var(--f-kode);font-weight:600;color:var(--ink)}
.sobek .sisa{margin-left:auto;font-family:var(--f-kode);font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--panel-2);white-space:nowrap}
.sobek.mepet .sisa{background:var(--awas);color:#fff}
.sobek.dekat .sisa{background:var(--awas-lembut);color:var(--awas)}
.sobek .lok{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Saringan */
.alat{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.cari{flex:1 1 240px;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--garis-kuat);border-radius:12px;padding:0 12px;height:44px;min-width:0}
.cari svg{width:18px;height:18px;color:var(--redup);flex:none}
.cari input{border:0;background:none;outline:none;width:100%;min-width:0;height:100%;font-size:15px}
.urut{height:44px;border-radius:12px;border:1px solid var(--garis-kuat);background:var(--panel);padding:0 10px;font-weight:600;font-size:14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--garis-kuat);background:var(--panel);font-weight:600;font-size:13.5px;cursor:pointer;display:flex;align-items:center;gap:6px}
.chip .n{font-family:var(--f-kode);font-size:11.5px;color:var(--redup)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.7}
.kosong{background:var(--panel);border:1px dashed var(--garis-kuat);border-radius:var(--r);padding:28px 18px;text-align:center;color:var(--ink-2)}

/* Daftar ringkas di beranda */
.baris{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--garis);border-radius:var(--r);overflow:hidden}
.br{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;border:0;border-top:1px solid var(--garis);background:none;text-align:left;cursor:pointer;width:100%}
.br:first-child{border-top:0}
.br:hover{background:var(--panel-2)}
.hitung{font-family:var(--f-judul);font-weight:800;font-size:24px;line-height:1;text-align:center}
.hitung small{display:block;font-family:var(--f-kode);font-size:10.5px;font-weight:500;color:var(--redup);margin-top:3px;letter-spacing:.04em}
.hitung.awas{color:var(--awas)}
.br .t1{font-weight:700;font-size:14.5px;line-height:1.3;overflow-wrap:anywhere}
.br .t2{font-size:13px;color:var(--ink-2);line-height:1.35;overflow-wrap:anywhere}

/* Lamaran */
.papan{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px}
.lam{background:var(--panel);border:1px solid var(--garis);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.mini{display:flex;align-items:center;gap:0}
.mini .stn{width:12px;height:12px;padding:0;border-radius:50%;background:var(--panel);border:2px solid var(--garis-kuat);flex:none;position:relative}
button.stn{cursor:pointer}
button.stn::after{content:"";position:absolute;inset:-10px}
button.stn:hover{border-color:var(--biru)}
.mini .stn.on{background:var(--biru);border-color:var(--biru)}
.mini .stn.skrg{width:16px;height:16px;box-shadow:0 0 0 4px var(--biru-lembut)}
.mini s{flex:1;height:2px;background:var(--garis-kuat);text-decoration:none}
.mini s.on{background:var(--biru)}
.mini.tolak .stn.on,.mini.tolak s.on{background:var(--bad);border-color:var(--bad)}
.mini.tolak .stn.skrg{box-shadow:0 0 0 4px var(--bad-lembut)}
.mini-ket{display:flex;justify-content:space-between;font-family:var(--f-kode);font-size:10.5px;color:var(--redup);margin-top:-4px}
.lam .ag{font-size:13px;background:var(--biru-lembut);color:var(--ink);border-radius:10px;padding:8px 10px}
.lam .ag b{color:var(--biru-teks)}
.lam .act{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.arsip{margin-top:24px}
.arsip summary{cursor:pointer;font-weight:700;color:var(--ink-2);padding:8px 0}

/* Tombol */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--garis-kuat);background:var(--panel);color:var(--ink);font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;box-shadow:0 2px 0 var(--garis-kuat);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(2px);box-shadow:0 0 0 var(--garis-kuat)}
.btn.utama{background:var(--biru);border-color:var(--biru);color:#fff;box-shadow:0 2px 0 var(--biru-tekan)}
.btn.utama:active{box-shadow:0 0 0 var(--biru-tekan)}
.btn.kecil{height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default;transform:none}
select.status{height:34px;border-radius:10px;border:1px solid var(--garis-kuat);background:var(--panel);font-weight:600;font-size:13px;padding:0 8px}

/* Lembar detail */
.tirai{position:fixed;inset:0;z-index:40;background:rgba(8,12,20,.45);opacity:0;transition:opacity .2s}
.tirai.buka{opacity:1}
.lembar{position:fixed;z-index:41;background:var(--panel);display:flex;flex-direction:column;box-shadow:0 -8px 40px rgba(0,0,0,.18);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
@media (min-width:761px){.lembar{top:0;right:0;bottom:0;width:min(560px,100%);transform:translateX(100%);padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px)}.lembar.buka{transform:none}}
@media (max-width:760px){.lembar{left:0;right:0;bottom:0;max-height:calc(100% - 40px - env(safe-area-inset-top,0px));border-radius:20px 20px 0 0;transform:translateY(100%);padding-bottom:env(safe-area-inset-bottom,0px)}.lembar.buka{transform:none}}
@media (prefers-reduced-motion:reduce){.lembar,.tirai,.rel-in .isi{transition:none}}
.l-kepala{display:flex;gap:12px;align-items:flex-start;padding:18px 20px 14px;border-bottom:1px solid var(--garis)}
.l-kepala .co{font-size:13.5px;font-weight:600;color:var(--ink-2)}
.l-kepala h2{font-size:24px;font-weight:800;line-height:1.1;margin-top:2px}
.l-kepala .ikon{margin-left:auto;flex:none;margin-top:-6px;margin-right:-8px}
.l-isi{overflow-y:auto;padding:16px 20px 24px;display:flex;flex-direction:column;gap:18px;padding-left:max(20px,env(safe-area-inset-left,0px))}
.blok h3{font-family:var(--f-kode);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--redup);margin-bottom:8px}
.blok p{margin:0;color:var(--ink-2)}
.nilai-besar{display:flex;align-items:center;gap:12px;background:var(--panel-2);border-radius:12px;padding:12px 14px}
.nilai-besar b{font-family:var(--f-judul);font-weight:800;font-size:30px;line-height:1}
.nilai-besar p{font-size:14px;color:var(--ink)}
.gugur{background:var(--bad-lembut);color:var(--bad);border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px}
.syarat{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.syarat li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px;color:var(--ink-2);font-size:14px}
.syarat li::before{content:"";width:8px;height:8px;border-radius:50%;border:2px solid var(--biru);margin-top:6px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 16px;margin:0;font-size:14px}
.kv dt{font-family:var(--f-kode);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--redup);padding-top:3px}
.kv dd{margin:0;color:var(--ink-2);overflow-wrap:anywhere;min-width:0}
/* map berkas */
.map{border-radius:4px 14px 14px 14px;background:var(--biru-lembut);padding:12px;position:relative;margin-top:18px}
.map::before{content:"paket lamaran";position:absolute;left:0;top:-22px;height:22px;padding:3px 14px 0;border-radius:10px 10px 0 0;background:var(--biru-lembut);font-family:var(--f-kode);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--biru-teks)}
.berkas{display:flex;flex-direction:column;gap:8px}
.isian{background:var(--panel);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:start}
.isian .lbl{font-family:var(--f-kode);font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--redup)}
.isian .val{grid-column:1;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;user-select:text}
.isian .val.kos{color:var(--awas);font-style:italic}
.isian .cat{grid-column:1;font-size:12.5px;color:var(--ink-2)}
.isian .salin{grid-column:2;grid-row:1/4;align-self:center}
.tanpa-paket{font-size:14px;color:var(--ink-2);background:var(--panel-2);border-radius:12px;padding:12px 14px}

/* Pilah */
.pilah-wrap{max-width:560px;margin:0 auto}
.bar{height:6px;border-radius:6px;background:var(--garis);overflow:hidden;margin:6px 0 18px}
.bar i{display:block;height:100%;background:var(--biru);border-radius:6px;transition:width .3s}
.tumpuk{position:relative;min-height:380px}

.pk.seret{transition:none;cursor:grabbing}
.pk.belakang{position:absolute;inset:10px 14px auto;z-index:-1;transform:scale(.96) translateY(10px);opacity:.6;pointer-events:none;min-height:200px}
.pk .k-judul{font-size:24px}

.stempel.lewat{left:18px;color:var(--redup);transform:rotate(-8deg)}

.aksi-pilah{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;margin-top:16px}
.aksi-pilah .btn{height:52px;font-size:15px}
.petunjuk{text-align:center;font-size:12.5px;color:var(--redup);margin-top:10px}
.petunjuk kbd{font-family:var(--f-kode);font-size:11px;border:1px solid var(--garis-kuat);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--panel)}

/* Langkah kirim */
.langkah{display:flex;flex-direction:column;gap:6px}
.lk-btn{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:center;text-align:left;background:var(--panel-2);border:0;border-radius:10px;padding:10px 12px;cursor:pointer;font-size:14px;font-weight:600}

.lk-btn[aria-checked="true"] .kotak::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.lk-btn[aria-checked="true"] span:last-child{color:var(--redup);text-decoration:line-through}
.btn.siap{animation:denyut 1.4s ease-in-out infinite}
@keyframes denyut{50%{box-shadow:0 2px 0 var(--biru-tekan),0 0 0 6px var(--biru-lembut)}}
@media (prefers-reduced-motion:reduce){.btn.siap{animation:none}.pk,.cincin circle.isi,.bar i{transition:none}}
.konfeti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}

.toast{position:fixed;left:50%;transform:translateX(-50%);z-index:60;bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);font-weight:600;font-size:14px;padding:10px 16px;border-radius:12px;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2);display:flex;align-items:center;gap:14px}

:root:not([data-theme="dark"]) .toast button{color:#9CC8F5}
@media (max-width:760px){.toast{bottom:calc(var(--tab-h) + 16px + env(safe-area-inset-bottom,0px))}}

<script>
const TAHAP=["Mau daftar","Udah daftar","Lolos berkas","Tes","Interview","Diterima"];
const SEMUA_STATUS=[...TAHAP,"Menunggu hasil","Ditolak","Batal"];
const PENDEK={"Mau daftar":"Mau","Udah daftar":"Daftar","Lolos berkas":"Berkas","Tes":"Tes","Interview":"Interview","Diterima":"Diterima"};
const AKTIF=["Udah daftar","Lolos berkas","Tes","Interview","Menunggu hasil"];
const LANJUT=["Lolos berkas","Tes","Interview","Diterima"];
const $=id=>document.getElementById(id);
let db=null,bisaTulis=false,demo=false,loker=[],lamaran=[],view="hari-ini",saring="cocok",cari="",urut="nilai",bukaId=null;
let lewati=new Set(),nanti=[],target=5;
const VIEWS=["hari-ini","pilah","loker","lamaran"];
try{const f=localStorage.getItem("js2-saring");if(f)saring=f;const u=localStorage.getItem("js2-urut");if(u)urut=u;const t=+localStorage.getItem("js2-target");if(t>=1&&t<=30)target=t}catch(e){}

const arr=x=>Array.isArray(x)?x:(x?[x]:[]);
function hariIni(){const d=new Date();d.setHours(0,0,0,0);return d}
function tgl(s){if(!s)return null;const d=new Date(s+"T00:00:00");return isNaN(d)?null:d}
function sisa(s){const d=tgl(s);return d?Math.round((d-hariIni())/864e5):null}
function fmt(s,panjang){const d=tgl(s);return d?d.toLocaleDateString("id-ID",panjang?{weekday:"long",day:"numeric",month:"long"}:{day:"numeric",month:"short"}):""}
function teksSisa(n){if(n===null)return"";if(n<0)return"lewat";if(n===0)return"hari ini";if(n===1)return"besok";return n+" hari"}
function el(tag,cls,teks){const e=document.createElement(tag);if(cls)e.className=cls;if(teks!=null)e.textContent=teks;return e}
function toast(m,aksi){const t=$("toast");t.textContent="";t.append(el("span",null,m));
  if(aksi){const b=el("button",null,aksi.label);b.type="button";b.addEventListener("click",()=>{t.hidden=true;aksi.fn()});t.append(b)}
  t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,aksi?4500:2400)}
function konfeti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=el("canvas","konfeti");document.body.append(c);const d=devicePixelRatio||1;const W=c.width=innerWidth*d,H=c.height=innerHeight*d;const g=c.getContext("2d");
  const warna=["#378ADD","#F5A300","#7B4FD6","#23A065"];
  const ps=Array.from({length:90},()=>({x:W/2+(Math.random()-.5)*W*.2,y:H*.75,vx:(Math.random()-.5)*16*d,vy:(-Math.random()*17-7)*d,r:(3+Math.random()*4)*d,w:warna[Math.random()*4|0]}));
  let t=0;(function f(){g.clearRect(0,0,W,H);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.55*d;p.vx*=.99;g.fillStyle=p.w;g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill()});if(++t<100)requestAnimationFrame(f);else c.remove()})();
}
const lamaranUntuk=id=>lamaran.find(l=>(l.loker_id||l._id)===id);
const gugur=l=>!!l.gugur||(sisa(l.deadline)!==null&&sisa(l.deadline)<0);
const teks=l=>[l.program,l.kategori,l.untuk].filter(Boolean).join(" ");
const RE_MT=/management trainee|\bMT\b|graduate|development program|\bODP\b|\bGDP\b|trainee|leadership|talent ?pool|fresh graduate program|campus hiring|ready4work|BFLP|PCPO|MDP|LADP|CLAP|NEDP|YMP|DMDP/i;
const RE_DATA=/data|analyst|analis|intelligence|research|riset|planning|\bBI\b|insight|GIS|statist|risk|credit|kredit|actuar/i;
const RE_IKLIM=/iklim|cuaca|weather|climat|meteor|lingkungan|environment|ESG|energi|energy|plantation|perkebunan|geofis|geophys|drone|HSE|SHEQ|sustainab|pertanian/i;
const SARING={
  cocok:{nama:"Cocok",f:l=>(l.nilai||0)>=4&&!gugur(l)},
  dekat:{nama:"Tutup ≤ 14 hari",f:l=>{const n=sisa(l.deadline);return n!==null&&n>=0&&n<=14&&!l.gugur}},
  mt:{nama:"MT & program",f:l=>RE_MT.test(l.program||"")&&!gugur(l)},
  data:{nama:"Data & analis",f:l=>RE_DATA.test(teks(l))&&!gugur(l)},
  iklim:{nama:"Iklim & lingkungan",f:l=>RE_IKLIM.test(teks(l))&&!gugur(l)},
  semua:{nama:"Semua aktif",f:l=>!gugur(l)},
  gugur:{nama:"Gugur",f:gugur}
};

/* Titik nilai */
function titik(n){const w=el("div","nilai"+(n===5?" lima":""));w.setAttribute("aria-label","Nilai "+(n||0)+" dari 5");for(let i=1;i<=5;i++)w.append(el("i",i<=(n||0)?"on":null));return w}
function tagsLoker(l,lm){
  const t=el("div","tags");
  if(lm)t.append(el("span","tag "+(lm.status==="Ditolak"?"bad":"ok"),lm.status));
  if(l.gugur)t.append(el("span","tag bad","Gugur"));
  if(lewati.has(l._id)&&!lm)t.append(el("span","tag","Dilewati"));
  if(arr(l.paket).length)t.append(el("span","tag biru","Paket siap"));
  if(l.status==="perlu dicek")t.append(el("span","tag awas","Perlu dicek"));
  if(l.risiko_jurusan)t.append(el("span","tag","Risiko jurusan"));
  if(RE_MT.test(l.program||""))t.append(el("span","tag","MT / program"));
  return t;
}
function kartuLoker(l){
  const lm=lamaranUntuk(l._id);
  const k=el("button","kartu");k.type="button";
  const a=el("div","k-atas");const kiri=el("div");kiri.style.minWidth="0";
  kiri.append(el("div","k-co",l.perusahaan||""));kiri.append(el("div","k-judul",l.program||""));
  a.append(kiri);a.append(titik(l.nilai));k.append(a);
  const t=tagsLoker(l,lm);if(t.childNodes.length)k.append(t);
  const n=sisa(l.deadline);const s=el("div","sobek"+(n!==null&&n>=0&&n<=3?" mepet":n!==null&&n>=0&&n<=14?" dekat":""));
  if(l.deadline){s.append(el("span","tgl","Tutup "+fmt(l.deadline)))}else s.append(el("span","tgl","Tanpa tenggat"));
  if(l.lokasi)s.append(el("span","lok",l.lokasi));
  if(n!==null)s.append(el("span","sisa",teksSisa(n)));
  k.append(s);
  k.addEventListener("click",()=>bukaLembar(l._id,k));
  return k;
}

/* Beranda */
function beranda(){
  const v=$("v-hari-ini");v.textContent="";
  const proses=lamaran.filter(l=>AKTIF.includes(l.status));
  const tutup=loker.filter(l=>{const n=sisa(l.deadline);const lm=lamaranUntuk(l._id);return n!==null&&n>=0&&n<=7&&!l.gugur&&(l.nilai||0)>=3&&(!lm||lm.status==="Mau daftar")}).sort((a,b)=>a.deadline.localeCompare(b.deadline));
  const h=el("div","hero");
  h.append(el("div","eyebrow",new Date().toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"})));
  const h1=el("h1");
  if(tutup.length){h1.append(el("em",null,tutup.length+" loker"));h1.append(document.createTextNode(" tutup minggu ini, "+proses.length+" lamaran nunggu kabar."))}
  else{h1.append(document.createTextNode(proses.length+" lamaran nunggu kabar. "));h1.append(el("em",null,"Aman minggu ini."))}
  h.append(h1);v.append(h);

  /* Target mingguan */
  const senin=hariIni();senin.setDate(senin.getDate()-((senin.getDay()+6)%7));
  const terkirim=lamaran.filter(l=>{const d=tgl(l.tanggal_daftar);return d&&d>=senin}).length;
  const tg=el("div","target");const cc=el("div","cincin");const R=34,K=2*Math.PI*R,p=Math.min(1,terkirim/target);
  cc.innerHTML='<svg viewBox="0 0 84 84" width="84" height="84" aria-hidden="true"><circle cx="42" cy="42" r="34" fill="none" stroke="var(--garis)" stroke-width="9"/><circle class="isi" cx="42" cy="42" r="34" fill="none" stroke="var(--biru)" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+K+'" stroke-dashoffset="'+K+'" transform="rotate(-90 42 42)"/></svg>';
  cc.append(el("b",null,terkirim+"/"+target));tg.append(cc);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{const c=cc.querySelector(".isi");if(c)c.style.strokeDashoffset=K*(1-p)}));
  const tx=el("div","tx");tx.append(el("b",null,terkirim>=target?"Target minggu ini kelar.":"Kirim "+(target-terkirim)+" lamaran lagi minggu ini"));
  tx.append(el("span",null,"Dihitung dari lamaran yang ditandai udah dikirim sejak Senin."));tg.append(tx);
  const ctl=el("div","ctrl");const kurang=el("button","btn kecil","−");kurang.type="button";kurang.setAttribute("aria-label","Kurangi target");
  const tambah=el("button","btn kecil","+");tambah.type="button";tambah.setAttribute("aria-label","Tambah target");
  const ubahTarget=n=>{target=Math.max(1,Math.min(30,target+n));try{localStorage.setItem("js2-target",target)}catch(e){}beranda()};
  kurang.addEventListener("click",()=>ubahTarget(-1));tambah.addEventListener("click",()=>ubahTarget(1));
  ctl.append(kurang,tambah);const kp=el("a","btn kecil utama","Pilah loker");kp.href="#pilah";ctl.append(kp);tg.append(ctl);v.append(tg);

  const ang=el("div","angka");
  const kotak=(n,t,c)=>{const d=el("div","ang"+(c?" "+c:""));d.append(el("b",null,String(n)));d.append(el("span",null,t));return d};
  ang.append(kotak(lamaran.filter(l=>!["Mau daftar","Batal"].includes(l.status)).length,"udah dilamar"));
  ang.append(kotak(proses.length,"lagi diproses"));
  ang.append(kotak(lamaran.filter(l=>LANJUT.includes(l.status)).length,"lolos ke tahap lanjut"));
  ang.append(kotak(loker.filter(l=>SARING.cocok.f(l)&&!lamaranUntuk(l._id)).length+lamaran.filter(l=>l.status==="Mau daftar").length,"cocok, belum dikirim","biru"));
  v.append(ang);

  /* Rel */
  const sh=el("div","sec-h");sh.append(el("h2",null,"Jalur lamaran"));v.append(sh);
  const rel=el("div","rel");const ri=el("div","rel-in");const isi=el("div","isi");ri.append(isi);
  const hit=TAHAP.map(s=>lamaran.filter(l=>l.status===s||(s==="Udah daftar"&&l.status==="Menunggu hasil")).length);
  let jauh=0;hit.forEach((c,i)=>{if(c)jauh=i});
  TAHAP.forEach((s,i)=>{const b=el("button","st"+(hit[i]?" ada":""));b.type="button";b.append(el("i",null,String(i+1)));b.append(el("b",null,String(hit[i])));b.append(el("span",null,s));b.addEventListener("click",()=>{location.hash="lamaran"});ri.append(b)});
  rel.append(ri);
  const ket=el("div","rel-ket");
  const tolak=lamaran.filter(l=>l.status==="Ditolak").length,batal=lamaran.filter(l=>l.status==="Batal").length;
  const k1=el("span");k1.append(el("b",null,String(tolak)));k1.append(" ditolak");ket.append(k1);
  const k2=el("span");k2.append(el("b",null,String(batal)));k2.append(" batal");ket.append(k2);
  const k3=el("span");k3.append("Stasiun terjauh: ");k3.append(el("b",null,TAHAP[jauh]));ket.append(k3);
  rel.append(ket);v.append(rel);
  requestAnimationFrame(()=>{isi.style.width="0";requestAnimationFrame(()=>{isi.style.width="calc("+(jauh/5)+" * (100% - 100%/6))"})});

  /* Tutup minggu ini */
  const s2=el("div","sec-h");s2.append(el("h2",null,"Tutup minggu ini"));s2.append(el("span","n",String(tutup.length)));
  const ke=el("a",null,"Semua loker →");ke.href="#loker";s2.append(ke);v.append(s2);
  if(!tutup.length)v.append(el("div","kosong","Ga ada loker bernilai 3 ke atas yang tutup 7 hari ke depan."));
  else{const b=el("div","baris");tutup.forEach(l=>{const n=sisa(l.deadline);const r=el("button","br");r.type="button";
    const hc=el("div","hitung"+(n<=3?" awas":""));hc.append(document.createTextNode(n===0?"0":String(n)));hc.append(el("small",null,n===0?"hari ini":n===1?"besok":"hari"));r.append(hc);
    const m=el("div");m.style.minWidth="0";m.append(el("div","t1",l.program||""));m.append(el("div","t2",(l.perusahaan||"")+" · tutup "+fmt(l.deadline)));r.append(m);
    r.append(titik(l.nilai));r.addEventListener("click",()=>bukaLembar(l._id,r));b.append(r)});v.append(b)}

  /* Nunggu kabar */
  const s3=el("div","sec-h");s3.append(el("h2",null,"Nunggu kabar"));s3.append(el("span","n",String(proses.length)));v.append(s3);
  if(!proses.length)v.append(el("div","kosong","Belum ada lamaran yang lagi diproses."));
  else{const b=el("div","baris");proses.sort((a,c)=>(c.tanggal_daftar||c.diperbarui||"").localeCompare(a.tanggal_daftar||a.diperbarui||"")).forEach(l=>{const r=el("div","br");r.style.cursor="default";
    const hc=el("div","hitung");const sejak=l.tanggal_daftar?-sisa(l.tanggal_daftar):null;hc.append(document.createTextNode(sejak!==null?String(sejak):"–"));hc.append(el("small",null,"hari lalu"));r.append(hc);
    const m=el("div");m.style.minWidth="0";m.append(el("div","t1",l.perusahaan||""));m.append(el("div","t2",[l.posisi,l.agenda].filter(Boolean).join(" · ")));r.append(m);
    r.append(el("span","tag ok",l.status));b.append(r)});v.append(b)}
}

/* Loker */
function halamanLoker(){

const hariStr=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};

async function ubahStatus(lm,st,b,diam){

  const naik=MAJU.indexOf(st)>MAJU.indexOf(lm.status==="Menunggu hasil"?"Udah daftar":lm.status);
  if(demo){Object.assign(lm,body);if(!diam)toast(lm.perusahaan+" → "+st);if(naik&&!diam)konfeti();semua();return true}
  try{await db.doc("lamaran/"+lm._id).update(body);if(!diam)toast(lm.perusahaan+" → "+st);if(naik&&!diam)konfeti();return true}catch(e){toast("Gagal nyimpen. Coba lagi bentar.");if(b)b.disabled=false;return false}
}

function pasangGeser(c,l){
  let x0=null,dx=0;
  c.addEventListener("pointerdown",e=>{if(e.button>0)return;x0=e.clientX;dx=0;c.classList.add("seret");try{c.setPointerCapture(e.pointerId)}catch(_){}});
  c.addEventListener("pointermove",e=>{if(x0===null)return;dx=e.clientX-x0;c.style.transform="translateX("+dx+"px) rotate("+(dx/20)+"deg)";c.dataset.arah=dx>50?"mau":dx<-50?"lewat":""});
  const lepas=()=>{if(x0===null)return;x0=null;c.classList.remove("seret");
    if(dx>110)putuskan(l,"mau",c);else if(dx<-110)putuskan(l,"lewat",c);else{c.style.transform="";c.dataset.arah=""}};
  c.addEventListener("pointerup",lepas);c.addEventListener("pointercancel",lepas);

  setTimeout(async()=>{sibuk=false;
    if(arah==="mau"){await tandai(l,null,true);toast("Masuk tracker: "+(l.perusahaan||"").split(" (")[0],{label:"Urungkan",fn:()=>batalMau(l)})}

async function batalMau(l){

document.addEventListener("keydown",e=>{

function simpan(){try{localStorage.setItem("js2-saring",saring);localStorage.setItem("js2-urut",urut)}catch(e){}}
function semua(){
  $("nn-loker").textContent=loker.filter(l=>!gugur(l)).length||"";$("nn-lamaran").textContent=lamaran.length||"";$("nn-pilah").textContent=antrean().length||"";
  VIEWS.forEach(k=>$("v-"+k).hidden=k!==view);
  document.querySelectorAll("[data-v]").forEach(a=>{if(a.dataset.v===view)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  if(view==="hari-ini")beranda();else if(view==="pilah"){if(!sibuk)halamanPilah()}else if(view==="loker")halamanLoker();else halamanLamaran();
  if(bukaId)isiLembar();
}
function rute(){const h=location.hash.slice(1);view=VIEWS.includes(h)?h:"hari-ini";semua();scrollTo(0,0)}
addEventListener("hashchange",rute);

/* Tema */
function setTema(t){const r=document.documentElement;if(t)r.dataset.theme=t;else delete r.dataset.theme;try{t?localStorage.setItem("js2-tema",t):localStorage.removeItem("js2-tema")}catch(e){}}
try{const t=localStorage.getItem("js2-tema");if(t)document.documentElement.dataset.theme=t}catch(e){}
$("tema").addEventListener("click",()=>{const r=document.documentElement;const gelap=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;setTema(gelap?"light":"dark")});

/* Data */
(async()=>{
  let snap=null;try{snap=JSON.parse($("snap").textContent)}catch(e){}
  if(snap){demo=true;bisaTulis=true;loker=snap.loker;lamaran=snap.lamaran;$("banner").hidden=false;$("banner-t").textContent="Data asli salinan "+snap.tanggal+" ("+loker.length+" loker, "+lamaran.length+" lamaran). Tombol dan status bisa dicoba, tapi perubahan di sini ga disimpan.";rute();return}
  rute();
  const timer=setTimeout(()=>toast("Belum tersambung ke data. Coba buka ulang."),10000);
  db=await claude.use("db");
  if(!db){clearTimeout(timer);$("v-"+view).prepend(el("div","kosong","Masuk ke akun Claude dulu buat buka Jobseeker."));return}
  const user=await claude.use("user");
  try{bisaTulis=user?await user.isOwner():false}catch(e){bisaTulis=false}
  let dapat=0;const selesai=s=>{if(!s.metadata.fromCache&&++dapat>=2)clearTimeout(timer)};
  db.collection("loker").onSnapshot(s=>{loker=s.docs.map(d=>({...d.data(),_id:d.id}));selesai(s);semua()},()=>toast("Loker gagal dimuat"));
  db.collection("lamaran").onSnapshot(s=>{lamaran=s.docs.map(d=>({...d.data(),_id:d.id}));selesai(s);semua()},()=>toast("Lamaran gagal dimuat"));
  db.collection("lewati").onSnapshot(s=>{lewati=new Set(s.docs.map(d=>d.id));semua()},()=>{});
})();
</script>
